apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: speech-transcription
  namespace: argo

spec:
  serviceAccountName: argo-workflow
  entrypoint: transcription

  arguments:
    parameters:
      - name: application_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      # Production and air-gapped deployments should mirror and pin this utility image internally.
      - name: utility_image
        value: python:3.11-alpine
      - name: parakeet_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: qwen_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: nemotron_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: voxtral_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: backends
        value: '["parakeet"]'

    artifacts:
      - name: recording

  volumes:
    - name: cache
      emptyDir: {}

    - name: work
      emptyDir: {}

  templates:
    - name: transcription
      inputs:
        artifacts:
          - name: recording

      dag:
        tasks:
          - name: validate-backends
            template: validate-backends
            arguments:
              parameters:
                - name: backends
                  value: "{{workflow.parameters.backends}}"

          - name: prepare
            dependencies:
              - validate-backends
            template: prepare
            arguments:
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"

          - name: publish-source
            # Source publication is CPU-only and intentionally overlaps prepare after validation.
            dependencies:
              - validate-backends
            template: publish-source
            arguments:
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"

          - name: transcribe-parakeet
            dependencies:
              - prepare
            when: "{{tasks.validate-backends.outputs.parameters.run_parakeet}} == true"
            template: transcribe-parakeet
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: publish-parakeet
            depends: "transcribe-parakeet.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: parakeet
              artifacts:
                - name: result
                  from: "{{tasks.transcribe-parakeet.outputs.artifacts.result}}"

          - name: transcribe-qwen
            dependencies:
              - prepare
            when: "{{tasks.validate-backends.outputs.parameters.run_qwen}} == true"
            template: transcribe-qwen
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: publish-qwen
            depends: "transcribe-qwen.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: qwen
              artifacts:
                - name: result
                  from: "{{tasks.transcribe-qwen.outputs.artifacts.result}}"

          - name: transcribe-nemotron
            dependencies:
              - prepare
            when: "{{tasks.validate-backends.outputs.parameters.run_nemotron}} == true"
            template: transcribe-nemotron
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: publish-nemotron
            depends: "transcribe-nemotron.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: nemotron
              artifacts:
                - name: result
                  from: "{{tasks.transcribe-nemotron.outputs.artifacts.result}}"

          - name: transcribe-voxtral
            dependencies:
              - prepare
            when: "{{tasks.validate-backends.outputs.parameters.run_voxtral}} == true"
            template: transcribe-voxtral
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: publish-voxtral
            depends: "transcribe-voxtral.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: voxtral
              artifacts:
                - name: result
                  from: "{{tasks.transcribe-voxtral.outputs.artifacts.result}}"

    - name: prepare
      inputs:
        artifacts:
          - name: recording
            path: /input/recording
            mode: 0644

      outputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/prepared/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.application_image}}"

        args:
          - prepare
          - /input/recording
          - --output
          - /work/prepared
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: validate-backends
      inputs:
        parameters:
          - name: backends

      outputs:
        parameters:
          - name: run_parakeet
            valueFrom:
              path: /tmp/run_parakeet
          - name: run_qwen
            valueFrom:
              path: /tmp/run_qwen
          - name: run_nemotron
            valueFrom:
              path: /tmp/run_nemotron
          - name: run_voxtral
            valueFrom:
              path: /tmp/run_voxtral

      container:
        image: "{{workflow.parameters.utility_image}}"
        command:
          - python
          - -c
        args:
          - |
            import json
            import os

            supported = {"parakeet", "qwen", "nemotron", "voxtral"}
            try:
                backends = json.loads(os.environ["BACKENDS"])
            except json.JSONDecodeError as error:
                raise SystemExit(f"backends must be a JSON array: {error}")
            if not isinstance(backends, list) or not backends:
                raise SystemExit("backends must be a non-empty JSON array")
            if any(not isinstance(backend, str) or backend not in supported for backend in backends):
                raise SystemExit(f"unsupported backend selection: {backends!r}")
            if len(set(backends)) != len(backends):
                raise SystemExit(f"duplicate backend selection: {backends!r}")
            for backend in supported:
                with open(f"/tmp/run_{backend}", "w", encoding="utf-8") as output:
                    output.write(str(backend in backends).lower())
        env:
          - name: BACKENDS
            value: "{{inputs.parameters.backends}}"

    - name: publish-source
      inputs:
        artifacts:
          - name: recording
            path: /work/source/recording
            mode: 0644

      outputs:
        artifacts:
          - name: published-source
            path: /work/published
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              endpoint: rustfs-svc.rustfs.svc.cluster.local:9000
              insecure: true
              addressingStyle: path
              bucket: transcription-data
              key: jobs/{{workflow.uid}}/source/
              accessKeySecret:
                name: rustfs-s3
                key: accessKey
              secretKeySecret:
                name: rustfs-s3
                key: secretKey

      container:
        image: "{{workflow.parameters.utility_image}}"
        command:
          - /bin/sh
          - -ec
        args:
          - mkdir -p /work/published && test -f /work/source/recording && cp /work/source/recording /work/published/recording

        volumeMounts:
          - name: work
            mountPath: /work

    - name: publish
      inputs:
        parameters:
          - name: backend
        artifacts:
          - name: result
            path: /work/result
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: published-result
            path: /work/published
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              endpoint: rustfs-svc.rustfs.svc.cluster.local:9000
              insecure: true
              addressingStyle: path
              bucket: transcription-data
              key: jobs/{{workflow.uid}}/{{inputs.parameters.backend}}/
              accessKeySecret:
                name: rustfs-s3
                key: accessKey
              secretKeySecret:
                name: rustfs-s3
                key: secretKey

      container:
        image: "{{workflow.parameters.utility_image}}"
        command:
          - /bin/sh
          - -ec
        args:
          - |
            mkdir -p /work/published
            for file in transcript.json transcript.txt asr_words.json metadata.json; do
              test -f "/work/result/$file"
              cp "/work/result/$file" "/work/published/$file"
            done

        volumeMounts:
          - name: work
            mountPath: /work

    - name: transcribe-parakeet
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/parakeet/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.parakeet_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - parakeet
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: transcribe-qwen
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/qwen/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.qwen_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - qwen
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: transcribe-nemotron
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/nemotron/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.nemotron_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - nemotron
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: transcribe-voxtral
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/voxtral/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.voxtral_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - voxtral
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work
