apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: speech-transcription
  namespace: argo

spec:
  serviceAccountName: argo-workflow
  entrypoint: transcription

  arguments:
    parameters:
      - name: application_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: parakeet_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: qwen_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: nemotron_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: voxtral_image
        value: ghcr.io/balex42/transcription-pipeline:sha-b6b6d90
      - name: backends
        value: '["parakeet"]'

    artifacts:
      - name: recording

  volumes:
    - name: model-cache
      persistentVolumeClaim:
        claimName: speech-model-cache

    - name: cache
      emptyDir: {}

    - name: work
      emptyDir: {}

  templates:
    - name: transcription
      inputs:
        artifacts:
          - name: recording

      dag:
        tasks:
          - name: prepare
            template: prepare
            arguments:
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"

          - name: backend
            dependencies:
              - prepare
            template: backend-pipeline
            withParam: "{{workflow.parameters.backends}}"
            arguments:
              parameters:
                - name: backend
                  value: "{{item}}"
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: recording
                  from: "{{inputs.artifacts.recording}}"

    - name: prepare
      inputs:
        artifacts:
          - name: recording
            path: /input/recording
            mode: 0644

      outputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/prepared/

      container:
        image: "{{workflow.parameters.application_image}}"

        args:
          - prepare
          - /input/recording
          - --output
          - /work/prepared
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: backend-pipeline
      inputs:
        parameters:
          - name: backend
        artifacts:
          - name: prepared
          - name: recording

      steps:
        - - name: validate-backend
            template: validate-backend
            arguments:
              parameters:
                - name: backend
                  value: "{{inputs.parameters.backend}}"
        - - name: parakeet
            template: parakeet-pipeline
            when: "{{inputs.parameters.backend}} == parakeet"
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
                - name: recording
                  from: "{{inputs.artifacts.recording}}"
          - name: qwen
            template: qwen-pipeline
            when: "{{inputs.parameters.backend}} == qwen"
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
                - name: recording
                  from: "{{inputs.artifacts.recording}}"
          - name: nemotron
            template: nemotron-pipeline
            when: "{{inputs.parameters.backend}} == nemotron"
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
                - name: recording
                  from: "{{inputs.artifacts.recording}}"
          - name: voxtral
            template: voxtral-pipeline
            when: "{{inputs.parameters.backend}} == voxtral"
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
                - name: recording
                  from: "{{inputs.artifacts.recording}}"

    - name: validate-backend
      inputs:
        parameters:
          - name: backend

      container:
        image: "{{workflow.parameters.application_image}}"
        command:
          - /bin/sh
          - -ec
        args:
          - |
            case "$BACKEND" in
              parakeet|qwen|nemotron|voxtral) ;;
              *) printf 'unsupported backend: %s\n' "$BACKEND" >&2; exit 2 ;;
            esac
        env:
          - name: BACKEND
            value: "{{inputs.parameters.backend}}"

    - name: parakeet-pipeline
      inputs:
        artifacts:
          - name: prepared
          - name: recording

      dag:
        tasks:
          - name: transcribe
            template: transcribe-parakeet
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
          - name: publish
            dependencies:
              - transcribe
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: parakeet
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"
                - name: result
                  from: "{{tasks.transcribe.outputs.artifacts.result}}"

    - name: qwen-pipeline
      inputs:
        artifacts:
          - name: prepared
          - name: recording

      dag:
        tasks:
          - name: transcribe
            template: transcribe-qwen
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
          - name: publish
            dependencies:
              - transcribe
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: qwen
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"
                - name: result
                  from: "{{tasks.transcribe.outputs.artifacts.result}}"

    - name: nemotron-pipeline
      inputs:
        artifacts:
          - name: prepared
          - name: recording

      dag:
        tasks:
          - name: transcribe
            template: transcribe-nemotron
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
          - name: publish
            dependencies:
              - transcribe
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: nemotron
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"
                - name: result
                  from: "{{tasks.transcribe.outputs.artifacts.result}}"

    - name: voxtral-pipeline
      inputs:
        artifacts:
          - name: prepared
          - name: recording

      dag:
        tasks:
          - name: transcribe
            template: transcribe-voxtral
            arguments:
              artifacts:
                - name: prepared
                  from: "{{inputs.artifacts.prepared}}"
          - name: publish
            dependencies:
              - transcribe
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: voxtral
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"
                - name: result
                  from: "{{tasks.transcribe.outputs.artifacts.result}}"

    - name: publish
      inputs:
        parameters:
          - name: backend
        artifacts:
          - name: recording
            path: /work/published/source/recording
            mode: 0644
          - name: result
            path: /work/published
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: published-result
            path: /work/published
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              key: transcription-data/jobs/{{workflow.uid}}/{{inputs.parameters.backend}}/

      container:
        image: "{{workflow.parameters.application_image}}"
        command:
          - /bin/sh
          - -ec
        args:
          - test -s /work/published/transcript.json && test -s /work/published/metadata.json

        volumeMounts:
          - name: work
            mountPath: /work

    - name: transcribe-parakeet
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/parakeet/

      container:
        image: "{{workflow.parameters.parakeet_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - parakeet
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: transcribe-qwen
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/qwen/

      container:
        image: "{{workflow.parameters.qwen_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - qwen
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: transcribe-nemotron
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/nemotron/

      container:
        image: "{{workflow.parameters.nemotron_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - nemotron
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: transcribe-voxtral
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/voxtral/

      container:
        image: "{{workflow.parameters.voxtral_image}}"

        args:
          - transcribe-prepared
          - --prepared
          - /work/prepared
          - --asr
          - voxtral
          - --output
          - /work/result
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work
