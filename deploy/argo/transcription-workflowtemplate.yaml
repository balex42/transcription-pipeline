apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: speech-transcription
  namespace: argo

spec:
  serviceAccountName: argo-workflow
  entrypoint: transcription

  arguments:
    parameters:
      - name: utility_image
        value: python:3.11-alpine
      - name: transformers_image
        value: ghcr.io/balex42/transcription-pipeline-transformers:sha-725aeb6
      - name: nemo_image
        value: ghcr.io/balex42/transcription-pipeline-nemo:sha-725aeb6
      - name: ctranslate2_image
        value: ghcr.io/balex42/transcription-pipeline-ctranslate2:sha-725aeb6
      - name: backends
        value: '["parakeet","primeline","qwen","nemotron","voxtral","faster-whisper","canary"]'

    artifacts:
      - name: recording

  volumes:
    - name: cache
      emptyDir: {}

    - name: work
      emptyDir: {}

  templates:
    - name: transcription
      inputs:
        artifacts:
          - name: recording

      dag:
        tasks:
          - name: validate-backends
            template: validate-backends
            arguments:
              parameters:
                - name: backends
                  value: "{{workflow.parameters.backends}}"

          - name: prepare
            depends: "validate-backends.Succeeded"
            template: prepare
            arguments:
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"

          - name: recognize-canary
            depends: "prepare.Succeeded"
            when: "{{tasks.validate-backends.outputs.parameters.run_canary}} == true"
            template: recognize-canary
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: finalize-canary
            depends: "recognize-canary.Succeeded"
            template: finalize
            arguments:
              parameters:
                - name: backend
                  value: canary
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: asr
                  from: "{{tasks.recognize-canary.outputs.artifacts.asr}}"

          - name: publish-canary
            depends: "finalize-canary.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: canary
              artifacts:
                - name: result
                  from: "{{tasks.finalize-canary.outputs.artifacts.result}}"

          - name: publish-source
            # Source publication is CPU-only and intentionally overlaps prepare after validation.
            depends: "validate-backends.Succeeded"
            template: publish-source
            arguments:
              artifacts:
                - name: recording
                  from: "{{inputs.artifacts.recording}}"

          - name: recognize-parakeet
            depends: "prepare.Succeeded"
            when: "{{tasks.validate-backends.outputs.parameters.run_parakeet}} == true"
            template: recognize-parakeet
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: finalize-parakeet
            depends: "recognize-parakeet.Succeeded"
            template: finalize
            arguments:
              parameters:
                - name: backend
                  value: parakeet
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: asr
                  from: "{{tasks.recognize-parakeet.outputs.artifacts.asr}}"

          - name: publish-parakeet
            depends: "finalize-parakeet.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: parakeet
              artifacts:
                - name: result
                  from: "{{tasks.finalize-parakeet.outputs.artifacts.result}}"

          - name: recognize-primeline
            depends: "prepare.Succeeded"
            when: "{{tasks.validate-backends.outputs.parameters.run_primeline}} == true"
            template: recognize-primeline
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: finalize-primeline
            depends: "recognize-primeline.Succeeded"
            template: finalize
            arguments:
              parameters:
                - name: backend
                  value: primeline
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: asr
                  from: "{{tasks.recognize-primeline.outputs.artifacts.asr}}"

          - name: publish-primeline
            depends: "finalize-primeline.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: primeline
              artifacts:
                - name: result
                  from: "{{tasks.finalize-primeline.outputs.artifacts.result}}"

          - name: recognize-qwen
            depends: "prepare.Succeeded"
            when: "{{tasks.validate-backends.outputs.parameters.run_qwen}} == true"
            template: recognize-qwen
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: finalize-qwen
            depends: "recognize-qwen.Succeeded"
            template: finalize
            arguments:
              parameters:
                - name: backend
                  value: qwen
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: asr
                  from: "{{tasks.recognize-qwen.outputs.artifacts.asr}}"

          - name: publish-qwen
            depends: "finalize-qwen.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: qwen
              artifacts:
                - name: result
                  from: "{{tasks.finalize-qwen.outputs.artifacts.result}}"

          - name: recognize-nemotron
            depends: "prepare.Succeeded"
            when: "{{tasks.validate-backends.outputs.parameters.run_nemotron}} == true"
            template: recognize-nemotron
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: finalize-nemotron
            depends: "recognize-nemotron.Succeeded"
            template: finalize
            arguments:
              parameters:
                - name: backend
                  value: nemotron
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: asr
                  from: "{{tasks.recognize-nemotron.outputs.artifacts.asr}}"

          - name: publish-nemotron
            depends: "finalize-nemotron.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: nemotron
              artifacts:
                - name: result
                  from: "{{tasks.finalize-nemotron.outputs.artifacts.result}}"

          - name: recognize-voxtral
            depends: "prepare.Succeeded"
            when: "{{tasks.validate-backends.outputs.parameters.run_voxtral}} == true"
            template: recognize-voxtral
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: finalize-voxtral
            depends: "recognize-voxtral.Succeeded"
            template: finalize
            arguments:
              parameters:
                - name: backend
                  value: voxtral
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: asr
                  from: "{{tasks.recognize-voxtral.outputs.artifacts.asr}}"

          - name: publish-voxtral
            depends: "finalize-voxtral.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: voxtral
              artifacts:
                - name: result
                  from: "{{tasks.finalize-voxtral.outputs.artifacts.result}}"

          - name: recognize-faster-whisper
            depends: "prepare.Succeeded"
            when: "{{tasks.validate-backends.outputs.parameters.run_faster_whisper}} == true"
            template: recognize-faster-whisper
            arguments:
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"

          - name: finalize-faster-whisper
            depends: "recognize-faster-whisper.Succeeded"
            template: finalize
            arguments:
              parameters:
                - name: backend
                  value: faster-whisper
              artifacts:
                - name: prepared
                  from: "{{tasks.prepare.outputs.artifacts.prepared}}"
                - name: asr
                  from: "{{tasks.recognize-faster-whisper.outputs.artifacts.asr}}"

          - name: publish-faster-whisper
            depends: "finalize-faster-whisper.Succeeded"
            template: publish
            arguments:
              parameters:
                - name: backend
                  value: faster-whisper
              artifacts:
                - name: result
                  from: "{{tasks.finalize-faster-whisper.outputs.artifacts.result}}"

    - name: prepare
      inputs:
        artifacts:
          - name: recording
            path: /input/recording
            mode: 0644

      outputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/prepared/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.transformers_image}}"

        args:
          - prepare
          - /input/recording
          - --output
          - /work/prepared
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: validate-backends
      inputs:
        parameters:
          - name: backends

      outputs:
        parameters:
          - name: run_parakeet
            valueFrom:
              path: /tmp/run_parakeet
          - name: run_primeline
            valueFrom:
              path: /tmp/run_primeline
          - name: run_qwen
            valueFrom:
              path: /tmp/run_qwen
          - name: run_nemotron
            valueFrom:
              path: /tmp/run_nemotron
          - name: run_voxtral
            valueFrom:
              path: /tmp/run_voxtral
          - name: run_faster_whisper
            valueFrom:
              path: /tmp/run_faster_whisper
          - name: run_canary
            valueFrom:
              path: /tmp/run_canary

      container:
        image: "{{workflow.parameters.utility_image}}"
        command:
          - python
          - -c
        args:
          - |
            import json
            import os

            supported = {"parakeet", "primeline", "qwen", "nemotron", "voxtral", "faster-whisper", "canary"}
            try:
                backends = json.loads(os.environ["BACKENDS"])
            except json.JSONDecodeError as error:
                raise SystemExit(f"backends must be a JSON array: {error}")
            if not isinstance(backends, list) or not backends:
                raise SystemExit("backends must be a non-empty JSON array")
            if any(not isinstance(backend, str) or backend not in supported for backend in backends):
                raise SystemExit(f"unsupported backend selection: {backends!r}")
            if len(set(backends)) != len(backends):
                raise SystemExit(f"duplicate backend selection: {backends!r}")
            for backend in supported:
                with open(f"/tmp/run_{backend.replace('-', '_')}", "w", encoding="utf-8") as output:
                    output.write(str(backend in backends).lower())
        env:
          - name: BACKENDS
            value: "{{inputs.parameters.backends}}"

    - name: publish-source
      inputs:
        artifacts:
          - name: recording
            path: /work/source/recording
            mode: 0644

      outputs:
        artifacts:
          - name: published-source
            path: /work/published
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              endpoint: rustfs-svc.rustfs.svc.cluster.local:9000
              insecure: true
              addressingStyle: path
              bucket: transcription-data
              key: jobs/{{workflow.uid}}/source/
              accessKeySecret:
                name: rustfs-s3
                key: accessKey
              secretKeySecret:
                name: rustfs-s3
                key: secretKey

      container:
        image: "{{workflow.parameters.utility_image}}"
        command:
          - /bin/sh
          - -ec
        args:
          - mkdir -p /work/published && test -f /work/source/recording && cp /work/source/recording /work/published/recording

        volumeMounts:
          - name: work
            mountPath: /work

    - name: publish
      inputs:
        parameters:
          - name: backend
        artifacts:
          - name: result
            path: /work/result
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: published-result
            path: /work/published
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              endpoint: rustfs-svc.rustfs.svc.cluster.local:9000
              insecure: true
              addressingStyle: path
              bucket: transcription-data
              key: jobs/{{workflow.uid}}/{{inputs.parameters.backend}}/
              accessKeySecret:
                name: rustfs-s3
                key: accessKey
              secretKeySecret:
                name: rustfs-s3
                key: secretKey

      container:
        image: "{{workflow.parameters.utility_image}}"
        command:
          - /bin/sh
          - -ec
        args:
          - |
            mkdir -p /work/published
            for file in transcript.json transcript.txt asr_words.json metadata.json; do
              test -f "/work/result/$file"
              cp "/work/result/$file" "/work/published/$file"
            done

        volumeMounts:
          - name: work
            mountPath: /work

    - name: recognize-parakeet
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: asr
            path: /work/asr
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/asr/parakeet/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.nemo_image}}"

        args:
          - recognize-prepared
          - --prepared
          - /work/prepared
          - --asr
          - parakeet
          - --output
          - /work/asr
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: recognize-qwen
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: asr
            path: /work/asr
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/asr/qwen/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.transformers_image}}"

        args:
          - recognize-prepared
          - --prepared
          - /work/prepared
          - --asr
          - qwen
          - --output
          - /work/asr
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: recognize-nemotron
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: asr
            path: /work/asr
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/asr/nemotron/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.transformers_image}}"

        args:
          - recognize-prepared
          - --prepared
          - /work/prepared
          - --asr
          - nemotron
          - --output
          - /work/asr
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: recognize-voxtral
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: asr
            path: /work/asr
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/asr/voxtral/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.transformers_image}}"

        args:
          - recognize-prepared
          - --prepared
          - /work/prepared
          - --asr
          - voxtral
          - --output
          - /work/asr
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: recognize-faster-whisper
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: asr
            path: /work/asr
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/asr/faster-whisper/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.ctranslate2_image}}"

        args:
          - recognize-prepared
          - --prepared
          - /work/prepared
          - --asr
          - faster-whisper
          - --output
          - /work/asr
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: recognize-primeline
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: asr
            path: /work/asr
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/asr/primeline/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.nemo_image}}"

        args:
          - recognize-prepared
          - --prepared
          - /work/prepared
          - --asr
          - primeline
          - --output
          - /work/asr
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

          - name: TRANSFORMERS_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: recognize-canary
      inputs:
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: asr
            path: /work/asr
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/asr/canary/

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speech-model-cache

      container:
        image: "{{workflow.parameters.nemo_image}}"

        args:
          - recognize-prepared
          - --prepared
          - /work/prepared
          - --asr
          - canary
          - --output
          - /work/asr
          - --working-directory
          - /work/tmp
          - --device
          - cuda

        env:
          - name: HF_HOME
            value: /models/huggingface

          - name: HF_HUB_OFFLINE
            value: "1"

        resources:
          limits:
            nvidia.com/gpu: "1"

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

          - name: cache
            mountPath: /cache

          - name: work
            mountPath: /work

    - name: finalize
      inputs:
        parameters:
          - name: backend
        artifacts:
          - name: prepared
            path: /work/prepared
            mode: 0755
            recurseMode: true
          - name: asr
            path: /work/asr
            mode: 0755
            recurseMode: true

      outputs:
        artifacts:
          - name: result
            path: /work/result
            archive:
              none: {}
            s3:
              key: runs/{{workflow.uid}}/result/{{inputs.parameters.backend}}/

      container:
        image: "{{workflow.parameters.transformers_image}}"
        args:
          - finalize-prepared
          - --prepared
          - /work/prepared
          - --asr-result
          - /work/asr
          - --expected-backend
          - "{{inputs.parameters.backend}}"
          - --output
          - /work/result
          - --working-directory
          - /tmp
