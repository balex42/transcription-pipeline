apiVersion: batch/v1
kind: Job
metadata:
  name: speech-transcription
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transcriber
          image: registry.example/speech-transcriber:0.1.0
          args:
            - transcribe
            - /input/audio.m4a
            - --output
            - /output
            - --working-directory
            - /work
            - --device
            - cuda
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: ASR_BACKEND
              value: nemotron
            - name: ASR_MODEL
              value: /models/nemotron-3.5-asr-streaming-0.6b
            - name: PYANNOTE_MODEL
              value: /models/pyannote-community-1
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: input
              mountPath: /input
              readOnly: true
            - name: output
              mountPath: /output
            - name: model-cache
              mountPath: /models
            - name: work
              mountPath: /work
            - name: cache
              mountPath: /cache
      volumes:
        - name: input
          persistentVolumeClaim:
            claimName: speech-input
        - name: output
          persistentVolumeClaim:
            claimName: speech-output
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: work
          emptyDir: {}
        - name: cache
          emptyDir: {}
