[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "speech-transcriber"
version = "0.1.0"
description = "Local, speaker-attributed speech transcription"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
runtime = [
  "accelerate==1.12.0",
  "librosa==0.11.0",
  "mistral-common[audio]==1.10.0",
  "numpy==2.2.6",
  "pyannote.audio==4.0.7",
  "soundfile==0.14.0",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchcodec==0.7.0",
  "transformers==5.13.0",
]
dev = [
  "accelerate==1.12.0",
  "librosa==0.11.0",
  "mistral-common[audio]==1.10.0",
  "numpy==2.2.6",
  "pyannote.audio==4.0.7",
  "soundfile==0.14.0",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchcodec==0.7.0",
  "transformers==5.13.0",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[project.scripts]
speech-transcriber = "speech_transcriber.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/speech_transcriber"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["pyannote.*", "soundfile.*", "torch.*", "torchaudio.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "nemo.*"]
ignore_missing_imports = true
