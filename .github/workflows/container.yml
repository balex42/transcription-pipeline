name: Container image

on:
  pull_request:
    paths:
      - "src/**"
      - "Containerfile"
      - "Containerfile.faster-whisper"
      - "Containerfile.canary"
      - "runtimes/**"
      - ".containerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Containerfile"
      - "Containerfile.faster-whisper"
      - "Containerfile.canary"
      - "runtimes/**"
      - ".containerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      generic: ${{ steps.filter.outputs.generic }}
      faster_whisper: ${{ steps.filter.outputs.faster_whisper }}
      canary: ${{ steps.filter.outputs.canary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            generic:
              - 'src/**'
              - 'Containerfile'
              - '.containerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/container.yml'
            faster_whisper:
              - 'src/**'
              - 'pyproject.toml'
              - 'Containerfile.faster-whisper'
              - 'runtimes/faster-whisper/**'
              - '.containerignore'
              - '.github/workflows/container.yml'
            canary:
              - 'src/**'
              - 'pyproject.toml'
              - 'Containerfile.canary'
              - 'runtimes/canary/**'
              - '.containerignore'
              - '.github/workflows/container.yml'

  build:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.generic == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-faster-whisper:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.faster_whisper == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-faster-whisper
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.faster-whisper
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-canary:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.canary == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-canary
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.canary
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
