name: Container image

on:
  pull_request:
    paths:
      - "src/**"
      - "container/**"
      - "Containerfile.transformers"
      - "Containerfile.nemo"
      - "Containerfile.ctranslate2"
      - "runtimes/**"
      - ".containerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "container/**"
      - "Containerfile.transformers"
      - "Containerfile.nemo"
      - "Containerfile.ctranslate2"
      - "runtimes/**"
      - ".containerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/container.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      transformers: ${{ steps.filter.outputs.transformers }}
      nemo: ${{ steps.filter.outputs.nemo }}
      ctranslate2: ${{ steps.filter.outputs.ctranslate2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            transformers:
              - 'src/**'
              - 'container/**'
              - 'Containerfile.transformers'
              - '.containerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/container.yml'
            nemo:
              - 'src/**'
              - 'container/**'
              - 'pyproject.toml'
              - 'Containerfile.nemo'
              - 'runtimes/nemo/**'
              - '.containerignore'
              - '.github/workflows/container.yml'
            ctranslate2:
              - 'src/**'
              - 'container/**'
              - 'pyproject.toml'
              - 'Containerfile.ctranslate2'
              - 'runtimes/ctranslate2/**'
              - '.containerignore'
              - '.github/workflows/container.yml'

  build-transformers:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.transformers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-transformers
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.transformers
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test arbitrary non-root UID
        run: |
          image="${{ steps.meta.outputs.tags }}"
          image="${image%%$'\n'*}"
          docker run --rm --user 12345:0 --entrypoint /usr/local/bin/uid-entrypoint "$image" \
            /app/.venv/bin/python -c "import os, pwd; print(pwd.getpwuid(os.getuid()))"

      - name: Smoke test arbitrary non-root UID with /cache masked
        run: |
          image="${{ steps.meta.outputs.tags }}"
          image="${image%%$'\n'*}"
          docker run --rm --user 12345:0 --tmpfs /cache \
            --entrypoint /usr/local/bin/uid-entrypoint "$image" \
            /app/.venv/bin/python -c "import os, pwd; print(pwd.getpwuid(os.getuid()))"

  build-nemo:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.nemo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nemo
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.nemo
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test arbitrary non-root UID
        run: |
          image="${{ steps.meta.outputs.tags }}"
          image="${image%%$'\n'*}"
          docker run --rm --user 12345:0 --entrypoint /usr/local/bin/uid-entrypoint "$image" \
            /app/.venv/bin/python -c "import os, pwd; print(pwd.getpwuid(os.getuid()))"

      - name: Smoke test arbitrary non-root UID with /cache masked
        run: |
          image="${{ steps.meta.outputs.tags }}"
          image="${image%%$'\n'*}"
          docker run --rm --user 12345:0 --tmpfs /cache \
            --entrypoint /usr/local/bin/uid-entrypoint "$image" \
            /app/.venv/bin/python -c "import os, pwd; print(pwd.getpwuid(os.getuid()))"

  build-ctranslate2:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.ctranslate2 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ctranslate2
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.ctranslate2
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test arbitrary non-root UID
        run: |
          image="${{ steps.meta.outputs.tags }}"
          image="${image%%$'\n'*}"
          docker run --rm --user 12345:0 --entrypoint /usr/local/bin/uid-entrypoint "$image" \
            /app/.venv/bin/python -c "import os, pwd; print(pwd.getpwuid(os.getuid()))"

      - name: Smoke test arbitrary non-root UID with /cache masked
        run: |
          image="${{ steps.meta.outputs.tags }}"
          image="${image%%$'\n'*}"
          docker run --rm --user 12345:0 --tmpfs /cache \
            --entrypoint /usr/local/bin/uid-entrypoint "$image" \
            /app/.venv/bin/python -c "import os, pwd; print(pwd.getpwuid(os.getuid()))"