name: Quality

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest